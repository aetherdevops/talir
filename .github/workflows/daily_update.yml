name: Daily Stock Update v2

on:
  schedule:
    # Runs at 02:00 UTC (04:00 Macedonia)
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install Deps
      run: npm install

    - name: Run Update Script
      run: npm run script:update

    # Warn only: an unrecorded split has to be checked against the issuer filing before the
    # registry is touched, but the rest of the refresh should still publish.
    - name: Detect unrecorded stock splits
      run: npm run detect:splits
      continue-on-error: true

    - name: Refresh issuer filings
      run: npm run script:issuers

    - name: Generate news feed
      run: npm run generate:news-feed

    - name: Generate results calendar
      run: npm run generate:results-calendar

    - name: Scrape MBI10 constituents
      run: npm run script:mbi10

    - name: Scrape MSE Fin.Ratios
      run: npm run scrape:mse-ratios
      continue-on-error: true

    - name: Ingest dividend documents (ALL, OCR + Supabase)
      id: ingest_dividends
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        TALIR_DOCUMENT_STORE: supabase
        TALIR_SCOPE: ALL
        TALIR_OCR_DIVIDENDS: '1'
        TALIR_PARSE_FORCE: '0'
      run: npm run ingest:dividends
      continue-on-error: true

    - name: Warn if dividend ingest failed
      if: steps.ingest_dividends.outcome == 'failure'
      run: echo "::warning::Dividend ingest failed — generate will use prior store/JSON. Check SECnet/OCR/Supabase."

    - name: Ingest fundamental documents (ALL, OCR + Supabase)
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        TALIR_DOCUMENT_STORE: supabase
        TALIR_SCOPE: ALL
        TALIR_OCR_FUNDAMENTALS: '1'
        TALIR_PARSE_FORCE: '0'
      run: npm run ingest:fundamentals
      continue-on-error: true

    - name: Ingest macro statistics (MakStat / NBRM / MoF → Supabase)
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: npm run ingest:macro
      continue-on-error: true

    - name: Generate macro dashboard
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: npm run generate:macro

    - name: Generate fundamentals
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        TALIR_DOCUMENT_STORE: supabase
        TALIR_PARSE_FUNDAMENTALS: '1'
        TALIR_OCR_FUNDAMENTALS: '1'
      run: npm run generate:fundamentals

    - name: Generate dividends calendar
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        TALIR_DOCUMENT_STORE: supabase
        TALIR_PARSE_DIVIDENDS: '1'
        TALIR_OCR_DIVIDENDS: '1'
      run: npm run generate:dividends

    - name: Report dividend coverage
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        TALIR_DOCUMENT_STORE: supabase
      run: npm run report:dividends
      continue-on-error: true

    - name: Regenerate derived assets
      run: npm run generate:sparklines && npm run generate:derived && npm run generate:search-index

    - name: Verify feed outputs
      run: |
        test -s lib/data/issuers.json
        test -s lib/data/news_feed.json
        test -s lib/data/derived_results_calendar.json
        test -s lib/data/derived_fundamentals.json
        test -s lib/data/derived_dividends.json
        test -s lib/data/derived_macro.json
        node -e "const j=require('./lib/data/news_feed.json'); console.log('news_feed:', j.count, 'items, dated', j.datedCount, ', lastIssuerScan', j.lastIssuerScan)"
        node -e "const r=require('./lib/data/derived_results_calendar.json'); console.log('results_calendar:', r.all.length, 'filed,', r.expected.length, 'expected')"
        node -e "const f=require('./lib/data/derived_fundamentals.json'); const eps=f.all.filter(e=>e.parseStatus==='parsed').length; console.log('fundamentals:', f.all.length, 'annual filings,', eps, 'parsed EPS')"
        node -e "const dv=require('./lib/data/derived_dividends.json'); console.log('dividends:', dv.all.length, 'calendars,', dv.upcomingExDates.length, 'upcoming ex-dates')"
        node -e "const m=require('./lib/data/derived_macro.json'); console.log('macro:', m.series.length, 'series, asOf', m.asOfDate, 'lastIngested', m.lastIngestedAt)"
        node -e "const d=require('./lib/data/derived_market.json'); const n=d.breadth?.history?.length ?? 0; console.log('derived breadth.history:', n, 'sessions (expected 10)'); if(n!==10) console.log('::warning:: breadth history length is', n, 'not 10');"
        if [ -f lib/data/derived_dividend_coverage.json ]; then
          node -e "
            const c=require('./lib/data/derived_dividend_coverage.json');
            const s=c.summary;
            const n=Math.max(s.totalCells,1);
            console.log('coverage: cells', s.totalCells, 'parsed', s.parsed, 'partial', s.partial, 'withGross', s.withGross, 'withEx', s.withEx, 'withPayment', s.withPayment, 'gaps', c.gaps.length);
            if (s.withGross/n < 0.6 || s.withEx/n < 0.6) console.log('::warning:: Dividend analytics core (gross+ex) below 60%:', 'gross', (s.withGross/n*100).toFixed(1)+'%', 'ex', (s.withEx/n*100).toFixed(1)+'%');
            if (s.withPayment/n < 0.4) console.log('::warning:: Dividend payment dates low:', (s.withPayment/n*100).toFixed(1)+'%');
          "
        fi
        if [ -f lib/data/mse_symbol_ratios.json ]; then
          node -e "
            const r=require('./lib/data/mse_symbol_ratios.json');
            const age=(Date.now()-new Date(r.generatedAt).getTime())/(864e5);
            console.log('mse_symbol_ratios ageDays', age.toFixed(1));
            if (age>14) console.log('::warning:: mse_symbol_ratios.json is', age.toFixed(1), 'days old (max 14)');
          "
        else
          echo '::warning:: mse_symbol_ratios.json missing'
        fi

    - name: Commit Changes
      run: |
        git config --global user.name "Scraper Bot"
        git config --global user.email "bot@example.com"

        if [[ -n $(git status --porcelain lib/data) ]]; then
          echo "New data found — staging lib/data (issuers.json, news_feed.json, scrape_meta.json, …)"
          git add lib/data
          git commit -m "chore: daily data refresh [skip ci]"
          git push
        else
          echo "No new data found."
        fi
