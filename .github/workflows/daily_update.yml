
name: Daily Stock Update v2

on:
  schedule:
    # Runs at 02:00 UTC (04:00 Macedonia)
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install Deps
      run: npm install

    - name: Run Update Script
      run: npm run script:update

    - name: Refresh issuer filings
      run: npm run script:issuers

    - name: Generate news feed
      run: npm run generate:news-feed

    - name: Regenerate derived assets
      run: npm run generate:sparklines && npm run generate:derived && npm run generate:search-index

    - name: Verify feed outputs
      run: |
        test -s lib/data/issuers.json
        test -s lib/data/news_feed.json
        node -e "const j=require('./lib/data/news_feed.json'); console.log('news_feed:', j.count, 'items, dated', j.datedCount, ', lastIssuerScan', j.lastIssuerScan)"
        node -e "const d=require('./lib/data/derived_market.json'); const n=d.breadth?.history?.length ?? 0; console.log('derived breadth.history:', n, 'sessions (expected 10)'); if(n!==10) console.log('::warning:: breadth history length is', n, 'not 10');"

    - name: Commit Changes
      run: |
        git config --global user.name "Scraper Bot"
        git config --global user.email "bot@example.com"

        if [[ -n $(git status --porcelain lib/data) ]]; then
          echo "New data found — staging lib/data (issuers.json, news_feed.json, scrape_meta.json, …)"
          git add lib/data
          git commit -m "chore: daily data refresh [skip ci]"
          git push
        else
          echo "No new data found."
        fi
